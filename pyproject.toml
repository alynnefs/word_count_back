[project]
name = "word-count-back"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
    "Flask==2.2.3",
    "Werkzeug==2.2.3",
    "Flask-Cors==3.0.10",
    "gunicorn==20.1.0",
    "prometheus-flask-exporter==0.23.1",
    "python-json-logger==2.0.7",
    "flask-swagger-ui>=4.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.2.1",
    "pytest-cov==4.1.0",
    "coverage==7.1.0",
    "black==22.3.0",
    "flake8==6.1.0",
    "Flake8-pyproject==1.2.3",
]

[tool.flake8]
max-line-length = 88
exclude = [".git", "__pycache__", ".specify", "specs"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-fail-under=80"

[tool.vercel]
entrypoint = "app.main:app"